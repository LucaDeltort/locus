[package]
name = "locus-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["LucaDeltort"]
repository = "https://github.com/LucaDeltort/locus"
description = "A fast, open-source tool for managing iOS/macOS localization files"
keywords = ["ios", "macos", "localization", "strings", "xcstrings"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uniffi = "0.29"

[dev-dependencies]
tempfile = "3"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]
