name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    name: Build macOS binary
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Build universal binary
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output locus \
            target/aarch64-apple-darwin/release/locus \
            target/x86_64-apple-darwin/release/locus
          tar czf locus-macos-universal.tar.gz locus

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: locus-macos-universal.tar.gz

  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: build-macos
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish
        run: cargo publish --all-features --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
