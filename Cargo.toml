[workspace]
members = ["crates/core", "crates/cli"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
authors = ["LucaDeltort"]
repository = "https://github.com/LucaDeltort/locus"
